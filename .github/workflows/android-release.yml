name: Android APK release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          code=$(sed -n 's/^  AndroidBundleVersionCode: //p' ProjectSettings/ProjectSettings.asset)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Install Unity and Android support
        id: unity
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: true

      - name: Activate Unity Personal
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Build and run validation
        uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a
        with:
          editor-path: ${{ steps.unity.outputs.unity-editor-path }}
          project-path: ${{ steps.unity.outputs.unity-project-path }}
          build-target: Android
          log-name: Android-Test-Build
          args: -quit -batchmode -nographics -executeMethod AndroidBuild.Build

      - name: Verify APK and checksum
        shell: bash
        run: |
          apk=build/Android/Castle-Master-3D.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          cd build/Android
          sha256sum Castle-Master-3D.apk > Castle-Master-3D.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK-test
          path: |
            build/Android/Castle-Master-3D.apk
            build/Android/Castle-Master-3D.apk.sha256
          if-no-files-found: error

  build-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Check release credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        shell: bash
        run: |
          missing=0
          for name in UNITY_EMAIL UNITY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          code=$(sed -n 's/^  AndroidBundleVersionCode: //p' ProjectSettings/ProjectSettings.asset)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match bundleVersion v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Install Unity and Android support
        id: unity
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: true

      - name: Activate Unity Personal
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/castle-master-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and run validation
        uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          editor-path: ${{ steps.unity.outputs.unity-editor-path }}
          project-path: ${{ steps.unity.outputs.unity-project-path }}
          build-target: Android
          log-name: Android-Release-Build
          args: -quit -batchmode -nographics -executeMethod AndroidBuild.Build

      - name: Verify APK and checksum
        shell: bash
        run: |
          apk=build/Android/Castle-Master-3D.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          cd build/Android
          sha256sum Castle-Master-3D.apk > Castle-Master-3D.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK-release
          path: |
            build/Android/Castle-Master-3D.apk
            build/Android/Castle-Master-3D.apk.sha256
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/castle-master-release.keystore"

  release:
    needs: build-release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-APK-release
          path: release
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            release/Castle-Master-3D.apk release/Castle-Master-3D.apk.sha256 \
            --verify-tag --title "Castle Master 3D $RELEASE_TAG" \
            --notes-file docs/release-notes.md
